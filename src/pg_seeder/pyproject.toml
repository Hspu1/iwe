[project]
name = "pg_seeder"
version = "0.1.0"
description = "whatcha wanna know huh"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.31.0",
    "orjson>=3.11.9",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uuid6>=2025.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_seeder"]
