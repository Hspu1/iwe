name: iwe

services:
  pg:
    image: postgres:18.4-bookworm
    container_name: pg
    shm_size: 2GB # shared memory (1.5GB) + reserve
    volumes:
    - ./deploy/postgresql/postgres.conf:/etc/postgresql/postgresql.conf:ro
    - ./deploy/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    - pg_data:/var/lib/postgresql
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3.5G
        reservations:
          memory: 3.5G
    restart: unless-stopped
    # oom_score_adj: ???
    # cpuset: ???

  pg-migrator:
    build:
      context: .
      dockerfile: ./deploy/iwe/Dockerfile
    container_name: pg-migrator
    env_file: .env
    command: ["alembic", "-c", "deploy/alembic/alembic.ini", "upgrade", "head"]
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    restart: on-failure:3
    # cpuset: ???

  pg-seeder:
    build:
      context: .
      dockerfile: ./deploy/pg_seeder/Dockerfile
    container_name: pg-seeder
    env_file: .env
    depends_on:
      pg-migrator:
        condition: service_completed_successfully
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    restart: on-failure:3
    # cpuset: ???

  iwe:
    build:
      context: .
      dockerfile: ./deploy/iwe/Dockerfile
      args:
        - APP_PORT=${APP_PORT:-8000}
    container_name: iwe
    volumes:
      - ./assets:/opt/scalar:ro
    env_file: .env
    depends_on:
      pg-seeder:
        condition: service_completed_successfully
    networks:
      - backend
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      - GRANIAN_PORT=${APP_PORT:-8000}
    healthcheck:
      test: |
        python3 -c "
        import http.client, os
        port = int(os.getenv('GRANIAN_PORT', 8000))
        try:
            conn = http.client.HTTPConnection('127.0.0.1', port, timeout=3)
            conn.request('GET', '/healthz/readiness')
            resp = conn.getresponse()
            exit(0) if resp.status == 200 else exit(1)
        except Exception:
            exit(1)
        "
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 768M
    restart: unless-stopped
    # oom_score_adj: ???
    # cpuset: ???

  krakend-gateway:
    image: krakend:2.13.8
    container_name: krakend-gateway
    depends_on:
      iwe:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/krakend:/etc/krakend
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    environment:
      - FC_ENABLE=1
      - FC_TEMPLATES=/etc/krakend/templates
      - IWE_URL=http://iwe:8000
    restart: unless-stopped
    # oom_score_adj: ???
    # cpuset: ???

  scalar-openapi:
    image: scalarapi/api-reference:0.5.61
    container_name: scalar-openapi
    depends_on:
      krakend-gateway:
        condition: service_started
    networks:
      - backend
    ports:
      - "8081:8080"
    volumes:
      - ./dist/openapi.json:/docs/openapi.json:ro
    environment:
      - SPEC_URL=/docs/openapi.json
      - |
        API_REFERENCE_CONFIG={
          "theme": "saturn",
          "layout": "classic",
          "hideDownloadButton": true,
          "hideClientButton": true,
          "hiddenClients": true,
          "hideSearch": true
        }
    restart: unless-stopped
    # oom_score_adj: ???
    # cpuset: ???

networks:
  backend:
    driver: bridge
    # internal: true
    enable_ipv6: false

volumes:
  pg_data:
    driver: local
